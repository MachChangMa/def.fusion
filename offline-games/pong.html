<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cosmic Pong — Fusion Offline</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1d32;color:#ecf3ff;font:15px Verdana;text-align:center;padding:12px}h1{font-size:20px;color:#e9d096;margin:6px}canvas{display:block;width:min(100%,700px);height:auto;margin:9px auto;border:3px solid #577b9a;background:#091325}button{border:1px solid #735e2e;background:#d7bd7d;color:#17243d;padding:9px 12px;margin:4px;font-weight:bold;cursor:pointer}.hint{font-size:12px;color:#bcd1e4}</style></head><body><h1>🏓 COSMIC PONG</h1><p id="score">YOU 0 — CPU 0</p><canvas id="board" width="700" height="400" aria-label="Pong playfield"></canvas><button id="restart">↻ RESTART</button><p class="hint">W/S or ↑/↓ to move. First to seven wins. Entirely local.</p><script>
const c=document.getElementById('board'),x=c.getContext('2d'),score=document.getElementById('score');let py,ey,bx,by,vx,vy,p,e,keys=new Set(),ended=false;const H=70;
function reset(){py=ey=200-H/2;bx=350;by=200;vx=-4;vy=2.5;p=e=0;ended=false;draw()}function serve(direction){bx=350;by=200;vx=direction*4.5;vy=(Math.random()-.5)*5;}
function update(){if(ended)return;if(keys.has('arrowup')||keys.has('w'))py-=6;if(keys.has('arrowdown')||keys.has('s'))py+=6;py=Math.max(0,Math.min(400-H,py));const target=by-H/2;ey+=Math.max(-3,Math.min(3,target-ey));ey=Math.max(0,Math.min(400-H,ey));bx+=vx;by+=vy;if(by<9||by>391)vy=-vy;
if(vx<0&&bx<=25&&bx>13&&by>=py&&by<=py+H){vx=Math.abs(vx)+.15;vy+=(by-(py+H/2))/14}
if(vx>0&&bx>=675&&bx<687&&by>=ey&&by<=ey+H){vx=-Math.abs(vx)-.15;vy+=(by-(ey+H/2))/14}
if(bx<0){e++;serve(1)}if(bx>700){p++;serve(-1)}if(p>=7||e>=7)ended=true;draw()}
function draw(){x.fillStyle='#091325';x.fillRect(0,0,700,400);x.strokeStyle='#314967';x.setLineDash([8,10]);x.beginPath();x.moveTo(350,0);x.lineTo(350,400);x.stroke();x.setLineDash([]);x.fillStyle='#a4dbdb';x.fillRect(14,py,12,H);x.fillStyle='#e0ba78';x.fillRect(674,ey,12,H);x.fillStyle='white';x.fillRect(bx-7,by-7,14,14);score.textContent=ended?(p>e?'YOU WIN!':'CPU WINS!')+' — '+p+' : '+e:'YOU '+p+' — CPU '+e}
document.addEventListener('keydown',ev=>{const k=ev.key.toLowerCase();if(['w','s','arrowup','arrowdown'].includes(k)){ev.preventDefault();keys.add(k)}});document.addEventListener('keyup',ev=>keys.delete(ev.key.toLowerCase()));document.getElementById('restart').addEventListener('click',reset);reset();setInterval(update,1000/60);
</script></body></html>
