<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Neon Snake — definitly Fusion Offline</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0e1d32;color:#ecf3ff;font:15px Verdana;text-align:center;padding:20px}h1{color:#e9d096;font-size:22px}canvas{display:block;width:min(100%,500px);height:auto;margin:14px auto;border:3px solid #577b9a;background:#091325;image-rendering:pixelated}button{background:#d7bd7d;border:1px solid #735e2e;color:#17243d;padding:10px 14px;font-weight:700;cursor:pointer}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.hint{font-size:12px;color:#acbfd6}</style></head>
<body><h1>🐍 NEON SNAKE</h1><p id="score">SCORE: 0</p><canvas id="screen" width="500" height="400" aria-label="Snake playfield"></canvas><div class="controls"><button id="left">◀ LEFT</button><button id="up">▲ UP</button><button id="down">▼ DOWN</button><button id="right">▶ RIGHT</button><button id="restart">↻ RESTART</button></div><p class="hint">Use arrow keys or WASD. Works entirely offline after Fusion has cached its files.</p>
<script>
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d'),score=document.getElementById('score');const C=20,W=25,H=20;
let snake,dir,next,food,points,dead;
function reset(){snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir={x:1,y:0};next={x:1,y:0};points=0;dead=false;spawn();draw()}
function spawn(){do{food={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)}}while(snake.some(q=>q.x===food.x&&q.y===food.y))}
function steer(x,y){if(x!==-dir.x||y!==-dir.y)next={x,y}}
function draw(){ctx.fillStyle='#091325';ctx.fillRect(0,0,500,400);ctx.strokeStyle='#162640';for(let x=0;x<500;x+=C){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,400);ctx.stroke()}for(let y=0;y<400;y+=C){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(500,y);ctx.stroke()}ctx.fillStyle='#eac989';ctx.fillRect(food.x*C+3,food.y*C+3,C-6,C-6);ctx.fillStyle='#75d6b8';snake.forEach((q,i)=>ctx.fillRect(q.x*C+2,q.y*C+2,C-4,C-4));score.textContent=dead?'GAME OVER — SCORE: '+points+' — RESTART TO PLAY':'SCORE: '+points}
function tick(){if(dead)return;dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const ate=h.x===food.x&&h.y===food.y;const body=ate?snake:snake.slice(0,-1);if(h.x<0||h.y<0||h.x>=W||h.y>=H||body.some(q=>q.x===h.x&&q.y===h.y)){dead=true;draw();return}snake.unshift(h);if(ate){points++;spawn()}else snake.pop();draw()}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),controls={arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0],arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1]};if(controls[k]){e.preventDefault();steer(...controls[k])}});
for(const [key,x,y] of [['left',-1,0],['right',1,0],['up',0,-1],['down',0,1]])document.getElementById(key).addEventListener('click',()=>steer(x,y));document.getElementById('restart').addEventListener('click',reset);reset();setInterval(tick,135);
</script></body></html>
