<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meteor Patrol — Fusion</title><style>body{background:#0b192b;color:#e5ecf3;text-align:center;font:14px Verdana}h1{color:#dfc889}canvas{display:block;width:min(96vw,800px);height:auto;margin:12px auto;background:#091528;border:3px solid #47648b}button{background:#d4bd88;padding:10px 18px;color:#13253e;border:0;font-weight:bold;margin:6px;touch-action:none}</style></head><body><h1>☄ METEOR PATROL</h1><p id="hud">Dodge falling meteors! Survive as long as possible.</p><canvas id="c" width="800" height="460" tabindex="0"></canvas><button id="start">START / RESTART</button><button data-k="arrowleft">◀</button><button data-k="arrowright">▶</button><p>Left / Right or A / D to move. Difficulty increases over time. Works offline.</p><script>
const c=document.getElementById('c'),g=c.getContext('2d'),hud=document.getElementById('hud');let x=400,rocks=[],keys=new Set(),time=0,spawn=0,hp=3,running=false,last=0,inv=0,high=0;function start(){x=400;rocks=[];time=0;spawn=0;hp=3;inv=0;running=true;c.focus()}function tick(t){let dt=Math.min((t-last)/1000||0,.04);last=t;if(running){time+=dt;inv=Math.max(0,inv-dt);let dir=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0);x=Math.max(24,Math.min(776,x+dir*360*dt));spawn-=dt;if(spawn<=0){spawn=Math.max(.17,.9-time*.009);rocks.push({x:Math.random()*770+15,y:-25,r:11+Math.random()*18,s:90+time*2.5+Math.random()*100})}for(let i=rocks.length-1;i>=0;i--){let r=rocks[i];r.y+=r.s*dt;if(r.y>490)rocks.splice(i,1);else if(inv<=0&&Math.hypot(r.x-x,r.y-405)<r.r+15){rocks.splice(i,1);hp--;inv=1.2;if(hp<=0){running=false;high=Math.max(high,Math.floor(time))}}}}g.fillStyle='#091528';g.fillRect(0,0,800,460);g.fillStyle='#1b3456';for(let i=0;i<40;i++)g.fillRect(i*41%800,(i*113)%460,2,2);for(const r of rocks){g.fillStyle='#ad8066';g.beginPath();g.arc(r.x,r.y,r.r,0,7);g.fill();g.strokeStyle='#d8ba8d';g.stroke()}if(inv===0||Math.floor(inv*12)%2===0){g.fillStyle='#7bbfe0';g.beginPath();g.moveTo(x,384);g.lineTo(x-20,430);g.lineTo(x,420);g.lineTo(x+20,430);g.closePath();g.fill()}hud.textContent=`SURVIVAL ${Math.floor(time)}s  •  SHIELDS ${hp}  •  BEST ${Math.max(high,Math.floor(time))}s`;if(!running){g.fillStyle='#d9c38b';g.font='bold 28px Verdana';g.textAlign='center';g.fillText(hp<=0?'SHIP DESTROYED':'METEOR PATROL',400,210);g.font='16px Verdana';g.fillText('Press START to play',400,246);g.textAlign='left'}requestAnimationFrame(tick)}document.getElementById('start').onclick=start;document.addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-k]').forEach(b=>{b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);keys.add(b.dataset.k)});b.addEventListener('pointerup',()=>keys.delete(b.dataset.k));b.addEventListener('pointercancel',()=>keys.delete(b.dataset.k))});requestAnimationFrame(tick)
</script></body></html>
