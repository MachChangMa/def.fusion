<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Brick Blaster — Fusion Offline</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1d32;color:#ecf3ff;font:15px Verdana;text-align:center;padding:12px}h1{font-size:20px;color:#e9d096;margin:6px}canvas{display:block;width:min(100%,700px);height:auto;margin:9px auto;border:3px solid #577b9a;background:#091325}button{border:1px solid #735e2e;background:#d7bd7d;color:#17243d;padding:9px 12px;margin:4px;font-weight:bold;cursor:pointer}.hint{font-size:12px;color:#bcd1e4}</style></head><body><h1>🧱 BRICK BLASTER</h1><p id="score">BRICKS: 36</p><canvas id="board" width="700" height="400" aria-label="Breakout playfield"></canvas><button id="restart">↻ RESTART</button><p class="hint">Move your mouse or use ←/→. Break all the bricks. Entirely local.</p><script>
const c=document.getElementById('board'),x=c.getContext('2d'),score=document.getElementById('score');let px,bx,by,vx,vy,bricks,ended=false,won=false,keys=new Set();const COLS=9,ROWS=4;
function reset(){px=305;bx=350;by=300;vx=3.2;vy=-3.6;ended=false;won=false;bricks=Array.from({length:ROWS},()=>Array(COLS).fill(true));draw()}
function update(){if(ended)return;if(keys.has('arrowleft')||keys.has('a'))px-=7;if(keys.has('arrowright')||keys.has('d'))px+=7;px=Math.max(0,Math.min(610,px));bx+=vx;by+=vy;if(bx<=8||bx>=692)vx=-vx;if(by<=8)vy=-vy;if(vy>0&&by>=358&&by<=373&&bx>=px&&bx<=px+90){vy=-Math.abs(vy);vx+=(bx-(px+45))/19}
for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++){if(!bricks[r][col])continue;const xx=15+col*75,yy=43+r*26;if(bx+8>xx&&bx-8<xx+68&&by+8>yy&&by-8<yy+19){bricks[r][col]=false;vy=-vy;break}}
if(by>405)ended=true;won=bricks.every(row=>row.every(v=>!v));if(won)ended=true;draw()}
function draw(){x.fillStyle='#091325';x.fillRect(0,0,700,400);let remaining=0;const colors=['#d9a66c','#d8c989','#7ebcbb','#91a6d4'];for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++){if(bricks[r][col]){remaining++;x.fillStyle=colors[r];x.fillRect(15+col*75,43+r*26,68,19)}}x.fillStyle='#c0d7e7';x.fillRect(px,367,90,12);x.fillStyle='white';x.beginPath();x.arc(bx,by,8,0,Math.PI*2);x.fill();score.textContent=ended?(won?'ALL BRICKS CLEARED!':'GAME OVER — RESTART TO TRY AGAIN'):'BRICKS REMAINING: '+remaining}
c.addEventListener('mousemove',ev=>{const b=c.getBoundingClientRect();px=Math.max(0,Math.min(610,((ev.clientX-b.left)/b.width)*700-45))});document.addEventListener('keydown',ev=>{const k=ev.key.toLowerCase();if(['arrowleft','arrowright','a','d'].includes(k)){ev.preventDefault();keys.add(k)}});document.addEventListener('keyup',ev=>keys.delete(ev.key.toLowerCase()));document.getElementById('restart').addEventListener('click',reset);reset();setInterval(update,1000/60);
</script></body></html>
