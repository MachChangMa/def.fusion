<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Aces — Fusion</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1727;color:#d9e6f5;font:14px Verdana,sans-serif;text-align:center}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;max-width:900px;margin:auto;padding:10px}h1{font-size:19px;color:#e2cd91;margin:5px}#info{font-weight:bold}canvas{width:min(96vw,900px);aspect-ratio: 800/480;display:block;margin:auto;border:3px solid #426080;background:#11243d;touch-action:none}button{background:#d4bd88;color:#152337;font-weight:700;padding:10px 15px;border:1px solid #695a3f;cursor:pointer}button:focus-visible{outline:3px solid white}p{margin:8px auto;color:#b6c9d9;max-width:900px}.touch{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:10px auto;user-select:none}.touch button{min-width:56px;touch-action:none}#start{font-size:15px}small{color:#9eb3c9}</style></head><body><header><h1>✈ SKY ACES</h1><span id="info">WAVE 1 • FALCON-1 • HP 100</span><button id="start">▶ START / RESTART</button></header><canvas width="800" height="480" id="screen" tabindex="0" aria-label="Jet combat game"></canvas><p>WASD / arrow keys to fly • SPACE to fire • P to pause. Clear waves to unlock faster jets and better weapons. Opponents start easy, then improve.</p><div class="touch"><button data-key="arrowleft">◀</button><button data-key="arrowup">▲</button><button data-key="arrowdown">▼</button><button data-key="arrowright">▶</button><button data-key="space">FIRE</button><button id="pause">PAUSE</button></div><small>Original standalone browser game · No external network access</small>
<script>
'use strict';const cv=document.querySelector('canvas'),ctx=cv.getContext('2d'),status=document.getElementById('info');let keys=new Set(),planes=[],shots=[],sparks=[],clouds=[],player,wave=1,kills=0,score=0,mode='title',last=0,nextWave=0,stars=[];
const tiers=[{name:'FALCON-1',speed:210,rate:.22,hp:100,spread:1,color:'#d5daec'},{name:'SWIFT-2',speed:245,rate:.18,hp:115,spread:1,color:'#80c9df'},{name:'HAWK-3',speed:270,rate:.15,hp:130,spread:2,color:'#e3c477'},{name:'PHANTOM-4',speed:290,rate:.12,hp:150,spread:3,color:'#b1a6e9'}];const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function init(){wave=1;kills=0;score=0;planes=[];shots=[];sparks=[];stars=Array.from({length:70},()=>({x:rand(0,800),y:rand(0,480),r:rand(.4,1.5)}));clouds=Array.from({length:9},()=>({x:rand(0,800),y:rand(0,480),r:rand(40,80)}));player={x:120,y:240,hp:100,inv:0,cool:0,tier:0};mode='play';spawnWave();cv.focus()}
function spawnWave(){planes=[];shots=[];const n=Math.min(3+Math.floor(wave*.75),11);for(let i=0;i<n;i++){let tough=wave>=4&&i%3===0,elite=wave>=7&&i%4===0;planes.push({x:850+i*95,y:rand(55,425),hp:elite?5:tough?3:2,max:elite?5:tough?3:2,kind:elite?2:tough?1:0,t:rand(0,9),cool:rand(1.3,4),speed:Math.min(80+wave*7,170),drift:rand(-1,1)})}nextWave=0;player.hp=Math.min(tiers[player.tier].hp,player.hp+25)}
function boom(x,y,color,count=14){for(let i=0;i<count;i++){let a=rand(0,6.283),v=rand(35,170);sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:rand(.2,.6),color})}}
function shoot(){const tier=tiers[player.tier];if(player.cool>0)return;player.cool=tier.rate;const offsets=tier.spread===3?[-11,0,11]:tier.spread===2?[-9,9]:[0];offsets.forEach(offset=>shots.push({x:player.x+23,y:player.y+offset,vx:490,vy:offset*.45,enemy:false,r:3}));}
function upgrade(){let level=wave>=10?3:wave>=7?2:wave>=4?1:0;if(level>player.tier){player.tier=level;player.hp=tiers[level].hp;boom(player.x,player.y,'#f5d687',28)}}
function update(dt){if(mode!=='play')return;const tier=tiers[player.tier];player.cool-=dt;player.inv=Math.max(0,player.inv-dt);let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);let mag=Math.hypot(dx,dy)||1;player.x=clamp(player.x+dx/mag*tier.speed*dt,26,770);player.y=clamp(player.y+dy/mag*tier.speed*dt,24,455);if(keys.has(' ')||keys.has('space'))shoot();
for(const c of clouds){c.x-=dt*19;if(c.x<-c.r*2){c.x=850;c.y=rand(20,480)}}
for(const e of planes){e.t+=dt;e.x-=e.speed*dt*.46;e.y+=Math.sin(e.t*(1.2+wave*.03))*dt*(16+wave*2)+e.drift*dt*11;e.y=clamp(e.y,25,460);if(e.x<390)e.x=Math.max(e.x,310+Math.sin(e.t*.6)*40);e.cool-=dt;const fireInterval=Math.max(.85,3.7-wave*.21)-(e.kind*.17);if(e.cool<=0 && e.x<790){e.cool=rand(fireInterval,fireInterval+1.2);const aim=Math.atan2(player.y-e.y,player.x-e.x)+rand(-Math.max(.09,.65-wave*.04),Math.max(.09,.65-wave*.04));const speed=140+wave*7+e.kind*10;shots.push({x:e.x-18,y:e.y,vx:Math.cos(aim)*speed,vy:Math.sin(aim)*speed,enemy:true,r:4})}}
for(let i=shots.length-1;i>=0;i--){const b=shots[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<-20||b.x>820||b.y<-20||b.y>500){shots.splice(i,1);continue}if(b.enemy){if(player.inv<=0&&Math.hypot(b.x-player.x,b.y-player.y)<19){player.hp-=12;player.inv=.7;boom(b.x,b.y,'#ff9b7b',6);shots.splice(i,1);if(player.hp<=0){mode='over';boom(player.x,player.y,'#ffa06a',38)}}}else{let hit=planes.find(e=>Math.hypot(b.x-e.x,b.y-e.y)<20);if(hit){hit.hp--;shots.splice(i,1);boom(b.x,b.y,'#e4cc8e',4);if(hit.hp<=0){planes.splice(planes.indexOf(hit),1);score+=100+wave*25;kills++;boom(hit.x,hit.y,hit.kind===2?'#a6c7ef':'#f2a773',20)}}}}
for(let i=sparks.length-1;i>=0;i--){let s=sparks[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.t-=dt;if(s.t<=0)sparks.splice(i,1)}if(!planes.length){nextWave+=dt;if(nextWave>1.6){wave++;upgrade();spawnWave()}}status.textContent=`WAVE ${wave} • ${tier.name} • HP ${Math.max(0,Math.ceil(player.hp))} • SCORE ${score}`}
function planeShape(x,y,size,enemy,color){ctx.save();ctx.translate(x,y);ctx.scale(enemy?-1:1,1);ctx.fillStyle=color;ctx.strokeStyle='#23334d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(23*size,0);ctx.lineTo(-13*size,-8*size);ctx.lineTo(-8*size,-20*size);ctx.lineTo(-20*size,-16*size);ctx.lineTo(-18*size,0);ctx.lineTo(-20*size,16*size);ctx.lineTo(-8*size,20*size);ctx.lineTo(-13*size,8*size);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#244565';ctx.fillRect(-2*size,-5*size,9*size,10*size);ctx.restore()}
function draw(){ctx.fillStyle='#0f2641';ctx.fillRect(0,0,800,480);ctx.strokeStyle='#1c3754';ctx.lineWidth=1;for(let x=0;x<800;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,480);ctx.stroke()}for(let y=0;y<480;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke()}for(const c of clouds){ctx.fillStyle='#1b3855';ctx.beginPath();ctx.ellipse(c.x,c.y,c.r,c.r*.35,0,0,Math.PI*2);ctx.fill()}if(player&&(player.inv===0||Math.floor(player.inv*16)%2===0))planeShape(player.x,player.y,1,false,tiers[player.tier].color);for(const e of planes){planeShape(e.x,e.y,e.kind===2?1.2:e.kind===1?1.08:1,true,e.kind===2?'#a47a9a':e.kind===1?'#c29b66':'#bc6669');ctx.fillStyle='#db7777';ctx.fillRect(e.x-20,e.y-29,40*(e.hp/e.max),3)}for(const b of shots){ctx.fillStyle=b.enemy?'#ff9b72':'#f1d87c';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}for(const s of sparks){ctx.globalAlpha=Math.max(0,s.t/.6);ctx.fillStyle=s.color;ctx.fillRect(s.x,s.y,3,3)}ctx.globalAlpha=1;
ctx.fillStyle='#0a1728bb';ctx.fillRect(12,12,210,38);ctx.fillStyle='#d3e2f2';ctx.font='bold 13px Verdana';ctx.fillText(`WAVE ${wave}      KILLS ${kills}`,21,28);ctx.fillStyle='#463e4c';ctx.fillRect(21,35,187,7);ctx.fillStyle='#84cba1';ctx.fillRect(21,35,187*Math.max(0,player?.hp||0)/tiers[player?.tier||0].hp,7);
if(mode==='title'||mode==='over'||mode==='pause'){ctx.fillStyle='#091222d9';ctx.fillRect(0,0,800,480);ctx.textAlign='center';ctx.fillStyle='#e4cf92';ctx.font='bold 35px Verdana';ctx.fillText(mode==='over'?'MISSION FAILED':mode==='pause'?'PAUSED':'SKY ACES',400,205);ctx.fillStyle='#e9edf4';ctx.font='18px Verdana';ctx.fillText(mode==='over'?`SCORE ${score} • REACHED WAVE ${wave}`:mode==='pause'?'PRESS P TO RESUME':'DOGFIGHT SQUADRON',400,248);ctx.font='14px Verdana';ctx.fillText(mode==='over'?'PRESS ENTER OR RESTART TO TRY AGAIN':mode==='title'?'PRESS ENTER OR START TO PLAY':'',400,280);ctx.textAlign='left'}else if(!planes.length){ctx.fillStyle='#e8d69e';ctx.font='bold 23px Verdana';ctx.textAlign='center';ctx.fillText(`WAVE ${wave} CLEAR!`,400,110);ctx.textAlign='left'} }
function frame(t){let dt=Math.min((t-last)/1000||0,.035);last=t;update(dt);draw();requestAnimationFrame(frame)}document.addEventListener('keydown',e=>{let key=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(key))e.preventDefault();keys.add(key);if(key==='enter'&&(mode==='title'||mode==='over'))init();if(key==='p')mode=mode==='pause'?'play':mode==='play'?'pause':mode});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>{keys.clear();if(mode==='play')mode='pause'});document.getElementById('start').onclick=init;document.getElementById('pause').onclick=()=>mode=mode==='pause'?'play':mode==='play'?'pause':mode;document.querySelectorAll('[data-key]').forEach(b=>{let key=b.dataset.key;const down=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(key)};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',()=>keys.delete(key));b.addEventListener('pointercancel',()=>keys.delete(key))});player={x:120,y:240,hp:100,tier:0,inv:0};stars=[];requestAnimationFrame(frame);
</script></body></html>
